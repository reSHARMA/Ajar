[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ajar"
version = "0.0.1"
description = "A least-privilege benchmark harness for tool-using agents"
readme = "ajar/README.md"
requires-python = ">=3.10"
# Intentionally EMPTY. lp-bench itself is stdlib-only: the benchmark under test
# (agentdojo) and the LLM client are both injected dependencies, never imported
# at module scope. `python -c "import ajar"` must work in a bare interpreter.
dependencies = []

[project.optional-dependencies]
# The vendored benchmark is installed from bench/agentdojo (see scripts/bootstrap.sh),
# not from PyPI, so it is deliberately not listed as a dependency here.
dev = ["pytest>=8.0"]
# The Bedrock-backed LLM client (ajar/llm/bedrock.py) is an OPTIONAL, injected
# dependency, mirroring the `dependencies = []` rule above: boto3 is imported lazily
# inside the client, never at module scope, so `import ajar` still works bare.
bedrock = ["boto3>=1.34"]

[tool.hatch.build.targets.wheel]
packages = ["ajar"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# `-q` keeps the reproduction figures legible when a smoke test fails.
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py310"
